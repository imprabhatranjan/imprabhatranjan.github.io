<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prabhat Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 1em;
        }
        .container {
            padding: 20px;
        }
        .image-container {
            text-align: center;
            margin-bottom: 20px;
        }
        .image-container img {
            width: 50%;
            border-radius: 8px;
        }
        .description {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .footer {
            background-color: #4CAF50;
            color: white;
            text-align: center;
            padding: 10px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to Prabhat's Page</h1>
    </header>

    <div class="container">
        <div class="image-container">
            <img src="https://via.placeholder.com/600x300" alt="Prabhat Image">
        </div>

        <div class="description">
            <h2>About Prabhat</h2>
            <p>Prabhat is passionate about technology, innovation, and creativity. This page is a simple representation of his interests and journey. Stay tuned for updates, articles, and exciting content that will be shared here!</p>
        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 Prabhat. All rights reserved.</p>
    </div>

</body>
</html>
